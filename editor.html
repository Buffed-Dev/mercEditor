<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Merc Editor</title>
    <style>
      /*
       * All this page owns is somewhere to mount.
       *
       * The old editor page had to dock the canvas itself, positioning it with
       * arithmetic on the shell's bar and status-bar heights and re-flowing it
       * with a class set on <html>. The canvas is a cell in the layout now, so
       * none of that is anyone's job any more.
       */
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0c0e13;
      }
      body {
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/Engine/editor/main.tsx"></script>
  </body>
</html>
